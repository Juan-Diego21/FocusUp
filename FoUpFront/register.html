<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Focus Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#0690CF",
              secundary: "#026b9b",
              dark: "#171717",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-[#171717] min-h-screen flex items-center justify-center font-inter p-[20px]"
  >
    <img
      src="img/Back.png"
      alt="Botón para volver atrás"
      class="absolute mt-5 ml-5 w-6 h-6 top-2.5 left-2.5 cursor-pointer"
      onclick="window.history.back();"
    />
    <div class="w-full max-w-md px-5">
      <div class="bg-[#232323] p-8 rounded-xl shadow-lg text-center">
        <!-- Logo -->
        <img
          src="img/Logo.png"
          alt="Logo de Focus Up"
          class="w-72 mx-auto pb-10"
        />

        <!-- Formulario -->
        <form class="space-y-5" aria-label="Formulario de registro">
          <!-- Nombre -->

          <div>
            <input
              type="text"
              placeholder="Nombre de usuario"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Nombre de usuario"
            />
          </div>

          <!-- Email -->
          <div>
            <input
              type="email"
              placeholder="Correo electrónico"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Correo electrónico"
            />
          </div>

          <!-- Contraseña -->
          <div>
            <input
              type="password"
              placeholder="Contraseña"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Contraseña"
            />
          </div>

          <!-- Confirmar Contraseña -->
          <div>
            <input
              type="password"
              placeholder="Confirmar Contraseña"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Confirmar Contraseña"
            />
          </div>

          <!-- Botón Registro -->
          <a
            href="register_2.html"
            class="w-full bg-[#0690cf] text-white py-3 rounded-lg font-medium hover:bg-[#068fcf9a] transition cursor-pointer text-center block"
            id="Boton_Registrarse"
          >
            Registrarse
          </a>

          <!-- Separador -->
          <div class="relative flex items-center justify-center text-gray-400">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="mx-4">o</span>
            <div class="flex-grow border-t border-gray-300"></div>
          </div>

          <!-- Botón Google -->
          <button
            type="button"
            class="w-full bg-white text-gray-800 py-3 rounded-lg font-medium border border-gray-300 flex items-center justify-center gap-2 hover:bg-gray-300 transition cursor-pointer"
            aria-label="Continuar con Google"
          >
            <img src="img/google.png" alt="Logo de Google" class="w-5" />
            Continuar con Google
          </button>
        </form>
      </div>
    </div>
    <script src="Js\script.js"></script>
  </body>
</html>
