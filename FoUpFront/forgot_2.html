<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Up - Verificación de Código</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              fondo: "#171717",
              azul: "#0690cf",
            },
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="bg-fondo min-h-screen flex items-center justify-center font-inter relative"
  >
    <img
      src="img/Back.png"
      alt=""
      class="absolute w-[25px] h-[25px] top-[10px] left-[10px] mt-[20px] ml-[20px] cursor-pointer"
      onclick="window.history.back();"
    />

    <div class="w-full max-w-[480px] p-5">
      <div class="bg-[#232323] p-8 rounded-[15px] shadow-lg text-center">
        <img
          src="img/Logo.png"
          alt="Logo de Focus Up"
          class="w-[300px] mx-auto pb-10"
        />

        <form
          class="login-form"
          aria-label="Formulario de verificación de código"
        >
          <p class="text-white mx-2 mb-10 text-center">
            Hemos enviado un código de verificación a tu correo para poder
            restablecer tu contraseña
          </p>

          <div
            class="flex justify-center gap-2 mb-8"
            role="group"
            aria-label="Código de verificación de 5 dígitos"
          >
            <input
              type="text"
              maxlength="1"
              pattern="[0-9]"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1); if(this.value.length == 1) this.nextElementSibling?.focus()"
              class="w-[50px] h-[50px] text-center text-2xl border-2 border-azul rounded-lg bg-[#232323] text-white mb-5 focus:outline-none focus:border-white"
              required
              aria-label="Dígito 1"
            />
            <input
              type="text"
              maxlength="1"
              pattern="[0-9]"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1); if(this.value.length == 1) this.nextElementSibling?.focus()"
              class="w-[50px] h-[50px] text-center text-2xl border-2 border-azul rounded-lg bg-[#232323] text-white mb-5 focus:outline-none focus:border-white"
              required
              aria-label="Dígito 2"
            />
            <input
              type="text"
              maxlength="1"
              pattern="[0-9]"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1); if(this.value.length == 1) this.nextElementSibling?.focus()"
              class="w-[50px] h-[50px] text-center text-2xl border-2 border-azul rounded-lg bg-[#232323] text-white mb-5 focus:outline-none focus:border-white"
              required
              aria-label="Dígito 3"
            />
            <input
              type="text"
              maxlength="1"
              pattern="[0-9]"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1); if(this.value.length == 1) this.nextElementSibling?.focus()"
              class="w-[50px] h-[50px] text-center text-2xl border-2 border-azul rounded-lg bg-[#232323] text-white mb-5 focus:outline-none focus:border-white"
              required
              aria-label="Dígito 4"
            />
            <input
              type="text"
              maxlength="1"
              pattern="[0-9]"
              oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 1); if(this.value.length == 1) this.nextElementSibling?.focus()"
              class="w-[50px] h-[50px] text-center text-2xl border-2 border-azul rounded-lg bg-[#232323] text-white mb-5 focus:outline-none focus:border-white"
              required
              aria-label="Dígito 5"
            />
          </div>

          <a
            href="forgot_3.html"
            class="block w-full py-4 bg-azul text-white rounded-lg text-base font-semibold cursor-pointer mb-5 hover:bg-[#068fcf9a] transition-colors text-center"
          >
            Continuar
          </a>
        </form>
      </div>
    </div>
    <script src="Js/script.js"></script>
  </body>
</html>
