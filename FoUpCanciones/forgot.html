<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Up - Recuperar Contraseña</title>
    <link rel="icon" href="img/Logo-marca.png" />
    <link href="src/output.css" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-black min-h-screen flex items-center justify-center p-5">
    <!-- Botón Atrás -->
    <img
      src="img/Back.png"
      alt="Volver atrás"
      class="absolute mt-5 ml-5 w-6 h-6 top-2.5 left-2.5 cursor-pointer"
      onclick="window.history.back();"
    />

    <!-- Contenedor Principal -->
    <div class="w-full max-w-md px-5">
      <div class="bg-[#171717] p-8 rounded-xl shadow-lg text-center">
        <!-- Logo -->
        <img
          src="img/Logo.png"
          alt="Logo de Focus Up"
          class="w-72 mx-auto pb-10"
        />

        <!-- Formulario -->
        <form
          class="space-y-5"
          aria-label="Formulario de recuperación de contraseña"
        >
          <!-- Instrucción -->
          <p class="text-white text-center mb-10 text-[18px] font-medium">
            Ingresa el correo electrónico asociado a tu cuenta
          </p>

          <!-- Campo Email -->
          <div>
            <input
              type="email"
              placeholder="Correo electrónico"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white text-gray-900"
              required
              aria-required="true"
              aria-label="Correo electrónico"
            />
          </div>

          <!-- Botón Continuar -->
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition-colors cursor-pointer"
            id="continue_button"
          >
            Continuar
          </button>
        </form>
      </div>
    </div>

    <script src="Js/script.js"></script>
  </body>
</html>
