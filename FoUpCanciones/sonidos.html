<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calm Album</title>
    <link rel="stylesheet" href="css/sonidos.css" />
    <link rel="stylesheet" href="css/player-bar-fix.css" />
    <link rel="stylesheet" href="css/song-list-fix.css" />
    <link rel="icon" href="img\Logo-marca.png" />
  </head>
  <body>
    <img
      src="img/Back.png"
      alt=""
      class="btn-atras"
      onclick="window.location.href='index.html';"
    />

    <header class="album-header">
      <div class="album-container">
        <img src="img\fondo-album.png" alt="Album Cover" class="fondo-album" />
        <div class="album-text-container">
          <h1 id="album-title" class="album-title"></h1>
          <p id="album-info" class="album-info"></p>
        </div>
      </div>
    </header>

    <main class="song-list">
      <ul id="song-list"></ul>
    </main>

    <!-- Player bar -->
    <div id="player-bar" class="player-bar hidden">
      <div class="player-album-info">
        <img
          id="player-album-image"
          src="img/fondo-album.png"
          alt="Album Cover"
        />
        <div class="player-song-text">
          <p id="player-song-name" class="player-song-name">Song Title</p>
          <p id="player-song-artist" class="player-song-artist">Artist Name</p>
        </div>
      </div>
      <div class="player-main-controls">
        <div class="playback-buttons">
          <button id="prev-btn" aria-label="Previous song">
            <img src="img/saltar-anterior.png" alt="Previous" />
          </button>
          <button id="play-pause-btn" aria-label="Play/Pause">
            <img id="play-pause-icon" src="img/pausa.png" alt="Play/Pause" />
          </button>
          <button id="next-btn" aria-label="Next song">
            <img src="img/saltar-siguiente.png" alt="Next" />
          </button>
        </div>
        <div class="progress-container">
          <span id="current-time" class="time-indicator">0:00</span>
          <input
            type="range"
            id="progress-bar"
            min="0"
            max="100"
            value="0"
            aria-label="Song progress"
          />
          <span id="total-duration" class="time-indicator">0:00</span>
        </div>
      </div>
      <div class="player-extra-controls">
        <img src="img/volumen.png" alt="Volume" class="volume-icon" />
        <input
          type="range"
          id="volume-slider"
          min="0"
          max="100"
          step="0.01"
          value="50"
          aria-label="Volume control"
        />

        <audio id="audio"></audio>
      </div>
    </div>

    <script>
      const audio = document.getElementById("audio");
      const songList = document.getElementById("song-list");
      const playerBar = document.getElementById("player-bar");
      const playPauseIcon = document.getElementById("play-pause-icon");
      const songNameDisplay = document.getElementById("player-song-name");
      const songArtistDisplay = document.getElementById("player-song-artist");
      const playPauseBtn = document.getElementById("play-pause-btn");
      const progressBar = document.getElementById("progress-bar");
      const currentTimeDisplay = document.getElementById("current-time");
      const totalDurationDisplay = document.getElementById("total-duration");
      const volumeSlider = document.getElementById("volume-slider");
      let currentSongIndex = -1;
      let canciones = [];

      const params = new URLSearchParams(window.location.search);
      const album = params.get("album") || "lofi";

      fetch("canciones.json")
        .then((res) => res.json())
        .then((data) => {
          canciones = data[album] || [];
          // Actualizar el nombre del álbum automáticamente
          const albumTitle = document.getElementById("album-title");
          albumTitle.textContent =
            album.charAt(0).toUpperCase() + album.slice(1);
          const albumInfo = document.getElementById("album-info");

          // Sumar la duración total estimada si tienes las duraciones como tiempo en segundos
          albumInfo.textContent = `${canciones.length} canciones`;

          canciones.forEach((cancion, index) => {
            const li = document.createElement("li");
            li.className = "song-row";
            li.innerHTML = `
          <div class="song-left">
            <button class="play-button" data-index="${index}">
              <img src="img/reproducir.png" alt="Play" />
            </button>
            <img src="img/fondo-album.png" alt="Cover" class="song-thumbnail" />
            <div class="song-info">
              <p class="song-name">${cancion.titulo || cancion.archivo}</p>
              <p class="song-artist">${
                cancion.artista || "Artista desconocido"
              }</p>
            </div>
          </div>
          <div class="song-right">
            <span class="song-duration">--:--</span>
            <button class="menu-button">
              <img src="img/menu-2.png" alt="Menu" />
            </button>
          </div>
        `;
            songList.appendChild(li);
            const audioTemp = document.createElement("audio");
            audioTemp.src = `albums/${encodeURIComponent("albums " + album)}/${
              cancion.archivo
            }`;
            audioTemp.addEventListener("loadedmetadata", () => {
              const duration = formatTime(audioTemp.duration);
              li.querySelector(".song-duration").textContent = duration;
            });
          });

          document.querySelectorAll(".play-button").forEach((btn, index) => {
            btn.addEventListener("click", () => {
              currentSongIndex = index;
              playSongByIndex(currentSongIndex);
            });
          });
        });

      // Botón de Play/Pausa
      playPauseBtn.addEventListener("click", () => {
        if (audio.paused) {
          audio.play();
          playPauseIcon.src = "img/pausa.png";
        } else {
          audio.pause();
          playPauseIcon.src = "img/reproducir.png";
        }
      });

      // Mostrar duración total y configurar la barra de progreso
      audio.addEventListener("loadedmetadata", () => {
        totalDurationDisplay.textContent = formatTime(audio.duration);
        progressBar.max = audio.duration;
      });

      // Actualizar tiempo actual y barra en reproducción
      audio.addEventListener("timeupdate", () => {
        progressBar.value = audio.currentTime;
        currentTimeDisplay.textContent = formatTime(audio.currentTime);
      });

      // Permitir adelantar o retroceder la canción
      progressBar.addEventListener("input", () => {
        audio.currentTime = progressBar.value;
      });

      // Control de volumen
      volumeSlider.addEventListener("input", () => {
        audio.volume = volumeSlider.value / 100;
      });

      // Función para formatear el tiempo (MM:SS)
      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
      }

      function playSongByIndex(index) {
        const cancion = canciones[index];
        const ruta = `albums/${encodeURIComponent("albums " + album)}/${
          cancion.archivo
        }`;
        audio.src = ruta;
        audio.play();
        console.log("Ruta del audio:", ruta);
        playerBar.classList.remove("hidden");
        playPauseIcon.src = "img/pausa.png";
        songNameDisplay.textContent = cancion.titulo || cancion.archivo;
        songArtistDisplay.textContent =
          cancion.artista || "Artista desconocido";
      }

      document.getElementById("next-btn").addEventListener("click", () => {
        if (currentSongIndex < canciones.length - 1) {
          currentSongIndex++;
          playSongByIndex(currentSongIndex);
        }
      });

      document.getElementById("prev-btn").addEventListener("click", () => {
        if (currentSongIndex > 0) {
          currentSongIndex--;
          playSongByIndex(currentSongIndex);
        }
      });
    </script>
  </body>
</html>
