<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calm Album</title>

  <!-- Flask URL versionado -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/sonidos.css') }}?v=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/player-bar-fix.css') }}?v=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/song-list-fix.css') }}?v=1.0">
  <link rel="icon" href="{{ url_for('static', filename='img/Logo-marca.png') }}" />
</head>
<body>
  <!-- Botón volver -->
  <img src="{{ url_for('static', filename='img/Back.png') }}" alt="Volver" class="btn-atras" onclick="window.history.back();">

  <!-- Encabezado del álbum -->
  <header class="album-header">
    <div class="album-container">
      <img src="{{ url_for('static', filename='img/fondo-album.png') }}" alt="Album Cover" class="fondo-album" />
      <div class="album-text-container">
        <h1 class="album-title">Calm</h1>
        <p class="album-info">10 songs • 36 min 50 sec</p>
      </div>
    </div>
  </header>

  <!-- Lista de canciones -->
  <main class="song-list">
    <ul>
      {% for i in range(1, 11) %}
      <li class="song-row">
        <div class="song-left">
          <button class="play-button" aria-label="Play song">
            <img src="{{ url_for('static', filename='img/reproducir.png') }}" alt="Play" />
          </button>
          <img src="{{ url_for('static', filename='img/fondo-album.png') }}" alt="Song Album Cover" class="song-thumbnail" />
          <div class="song-info">
            <p class="song-name">Song Title {{ i }}</p>
            <p class="song-artist">Artist Name</p>
          </div>
        </div>
        <div class="song-right">
          <span class="song-duration">3:45</span>
          <button class="menu-button" aria-label="Song menu">
            <img src="{{ url_for('static', filename='img/menu-2.png') }}" alt="Menu" />
          </button>
        </div>
      </li>
      {% endfor %}
    </ul>
  </main>

  <!-- Player bar -->
  <div id="player-bar" class="player-bar hidden">
    <div class="player-album-info">
      <img id="player-album-image" src="{{ url_for('static', filename='img/fondo-album.png') }}" alt="Album Cover" />
      <div class="player-song-text">
        <p id="player-song-name" class="player-song-name">Song Title</p>
        <p id="player-song-artist" class="player-song-artist">Artist Name</p>
      </div>
    </div>
    <div class="player-main-controls">
      <div class="playback-buttons">
        <button id="prev-btn" aria-label="Previous song">
          <img src="{{ url_for('static', filename='img/saltar-anterior.png') }}" alt="Previous" />
        </button>
        <button id="play-pause-btn" aria-label="Play/Pause">
          <img id="play-pause-icon" src="{{ url_for('static', filename='img/pausa.png') }}" alt="Play/Pause" />
        </button>
        <button id="next-btn" aria-label="Next song">
          <img src="{{ url_for('static', filename='img/saltar-siguiente.png') }}" alt="Next" />
        </button>
      </div>
      <div class="progress-container">
        <span id="current-time" class="time-indicator">0:00</span>
        <input type="range" id="progress-bar" min="0" max="100" value="0" aria-label="Song progress" />
        <span id="total-duration" class="time-indicator">0:00</span>
      </div>
    </div>
    <div class="player-extra-controls">
      <img src="{{ url_for('static', filename='img/volumen.png') }}" alt="Volume" class="volume-icon" />
      <input type="range" id="volume-slider" min="0" max="100" step="0.01" value="50" aria-label="Volume control" />
      <audio id="audio" src="{{ url_for('static', filename='canciones/cancion1.mp3') }}"></audio>
    </div>
  </div>

  <!-- Script de reproducción -->
  <script>
    const audio = document.getElementById("audio");
    const playPauseBtn = document.getElementById("play-pause-btn");
    const playPauseIcon = document.getElementById("play-pause-icon");
    const progressBar = document.getElementById("progress-bar");
    const currentTimeDisplay = document.getElementById("current-time");
    const totalDurationDisplay = document.getElementById("total-duration");
    const volumeSlider = document.getElementById("volume-slider");

    audio.addEventListener("loadedmetadata", () => {
      totalDurationDisplay.textContent = formatTime(audio.duration);
      progressBar.max = audio.duration;
    });

    audio.addEventListener("timeupdate", () => {
      progressBar.value = audio.currentTime;
      currentTimeDisplay.textContent = formatTime(audio.currentTime);
    });

    playPauseBtn.addEventListener("click", () => {
      if (audio.paused) {
        audio.play();
        playPauseIcon.src = "{{ url_for('static', filename='img/pausa.png') }}";
      } else {
        audio.pause();
        playPauseIcon.src = "{{ url_for('static', filename='img/reproducir.png') }}";
      }
    });

    progressBar.addEventListener("input", () => {
      audio.currentTime = progressBar.value;
    });

    volumeSlider.addEventListener("input", () => {
      audio.volume = volumeSlider.value / 100;
    });

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
    }
  </script>
</body>
</html>
