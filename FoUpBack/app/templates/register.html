<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Focus Up</title>

    <!-- Tailwind compilado -->
    <link href="{{ url_for('static', filename='src/output.css') }}" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>


    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              primary: "#0690CF",
              secundary: "#026b9b",
              dark: "#171717",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-black min-h-screen flex items-center justify-center font-inter p-[20px]">

    <!-- Botón atrás -->
    <img
      src="{{ url_for('static', filename='img/Back.png') }}"
      alt="Botón para volver atrás"
      class="absolute mt-5 ml-5 w-6 h-6 top-2.5 left-2.5 cursor-pointer"
      onclick="window.history.back();"
    />

    <div class="w-full max-w-md px-5">
      <div class="bg-[#171717] p-8 rounded-xl shadow-lg text-center">

        <!-- Logo -->
        <img
          src="{{ url_for('static', filename='img/Logo.png') }}"
          alt="Logo de Focus Up"
          class="w-72 mx-auto pb-10"
        />

        <!-- Formulario -->
        <form class="space-y-5" method="POST" action="{{ url_for('user_bp.register') }}" aria-label="Formulario de registro">

          <!-- Nombre -->
          <div>
            <input
              type="text"
              name="nombre"
              placeholder="Nombre de usuario"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Nombre de usuario"
            />
          </div>

          <!-- Email -->
          <div>
            <input
              type="email"
              name="email"
              placeholder="Correo electrónico"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Correo electrónico"
            />
          </div>

          <!-- Contraseña -->
          <div>
            <input
              type="contraseña"
              name="contraseña"
              placeholder="contraseña"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="contraseña"
            />
          </div>

          <!-- Confirmar Contraseña -->
          <div>
            <input
              type="password"
              name="confirm_password"
              placeholder="Confirmar Contraseña"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-900 bg-white"
              required
              aria-required="true"
              aria-label="Confirmar Contraseña"
            />
          </div>

          <!-- Botón Registro -->
          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-medium hover:bg-blue-700 transition cursor-pointer"
            id="Boton_Registrarse"
          >
            Registrarse
          </button>

          <!-- Separador -->
          <div class="relative flex items-center justify-center text-gray-400">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="mx-4">o</span>
            <div class="flex-grow border-t border-gray-300"></div>
          </div>

          <!-- Botón Google -->
          <button
            type="button"
            class="w-full bg-white text-gray-800 py-3 rounded-lg font-medium border border-gray-300 flex items-center justify-center gap-2 hover:bg-gray-300 transition cursor-pointer"
            aria-label="Continuar con Google"
          >
            <img src="{{ url_for('static', filename='img/google.png') }}" alt="Logo de Google" class="w-5" />
            Continuar con Google
          </button>
        </form>
      </div>
    </div>

    <!-- Script personalizado -->
    <script src="{{ url_for('static', filename='Js/script.js') }}"></script>
  </body>
</html>
