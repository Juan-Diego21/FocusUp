<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Evento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/crear-evento.css') }}" />
  </head>
  <body>
    <img
      src="{{ url_for('static', filename='img/Back.png') }}"
      alt="Volver"
      class="btn-atras"
      onclick="window.history.back();"
    />

    <div class="contenedor">
      <h1 id="tituloFormulario">Registrar Evento</h1>

      <form method="post" action="{{ url_for('event_bp.event_create') }}">
        <!-- Puedes agregar un campo hidden si vas a editar -->
        <!-- <input type="hidden" name="evento_id" value="{{ evento_id }}"> -->

        <input type="text" name="nombre_evento" placeholder="Título" required />
        <input type="date" name="fecha_evento" required />
        <input type="time" name="hora_evento" required />
        <textarea name="descripcion_evento" placeholder="Descripción" required></textarea>

        <div class="botones-extra">
          <button type="button" id="btn-añadir-mde">Añadir método de estudio</button>
          <button type="button" id="btn-añadir-s">Añadir sonido</button>
        </div>

          <a href="{{ url_for('user_bp.profile') }}" class="btn-guardar">Guardar Evento</a>
      </form>
    </div>

    <script src="{{ url_for('static', filename='Js/crear-evento.js') }}"></script>
  </body>
</html>
